---
# Kong role - Kong-related tools and collaboration apps

- name: Include Kong CLI tools (deck and kongctl)
  ansible.builtin.import_role:
    name: kong/kong-cli
  tags: [kong, kong-cli, deck, kongctl]

- name: Include Insomnia
  ansible.builtin.import_role:
    name: kong/insomnia
  tags: [kong, insomnia]

- name: Include Instruqt CLI
  ansible.builtin.import_role:
    name: kong/instruqt-cli
  tags: [kong, instruqt-cli]

- name: Include oq performant jq alternative
  ansible.builtin.import_role:
    name: kong/oq
  tags: [kong, oq]
