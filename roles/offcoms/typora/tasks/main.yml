---
# Typora markdown editor installation via APT repository

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Download Typora GPG key
  ansible.builtin.get_url:
    url: https://downloads.typora.io/typora.gpg
    dest: /etc/apt/keyrings/typora.gpg
    mode: "0644"
  become: true
  when: app_states.typora | default('present') == 'present'

# Remove old .list format file (cleanup from apt_repository to deb822_repository migration)
- name: Remove old Typora .list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/typora.list
    state: absent
  become: true
  when: app_states.typora | default('present') == 'present'

# Use deb822 format to prevent duplicate repository entries
# For ARM support, change architectures to: amd64,arm64
- name: Add Typora APT repository (deb822)
  ansible.builtin.deb822_repository:
    name: typora
    types: [deb]
    uris: https://downloads.typora.io/linux
    suites: "./"
    components: []
    architectures: amd64
    signed_by: /etc/apt/keyrings/typora.gpg
    state: present
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Update APT cache after repository changes
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Install Typora
  ansible.builtin.apt:
    name: typora
    state: "{{ app_states.typora | default('present') }}"
    purge: "{{ app_states.typora | default('present') == 'absent' }}"
  become: true

- name: Install Pandoc (required for Typora export features)
  ansible.builtin.apt:
    name: pandoc
    state: "{{ app_states.typora | default('present') }}"
    purge: "{{ app_states.typora | default('present') == 'absent' }}"
  become: true

# mdopen desktop file for launching Typora detached
- name: Create local applications directory for desktop files
  ansible.builtin.file:
    path: "{{ user.home }}/.local/share/applications"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Deploy mdopen desktop file for Typora launcher
  ansible.builtin.template:
    src: mdopen.desktop.j2
    dest: "{{ user.home }}/.local/share/applications/mdopen.desktop"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
  become: true
  when: app_states.typora | default('present') == 'present'

# Cleanup when absent
- name: Remove Typora APT repository when absent
  ansible.builtin.deb822_repository:
    name: typora
    state: absent
  become: true
  when: app_states.typora | default('present') == 'absent'

- name: Remove Typora GPG key when absent
  ansible.builtin.file:
    path: /etc/apt/keyrings/typora.gpg
    state: absent
  become: true
  when: app_states.typora | default('present') == 'absent'

- name: Remove mdopen desktop file when absent
  ansible.builtin.file:
    path: "{{ user.home }}/.local/share/applications/mdopen.desktop"
    state: absent
  become: true
  when: app_states.typora | default('present') == 'absent'
