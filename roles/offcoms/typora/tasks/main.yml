---
# Typora markdown editor installation via APT repository

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Download Typora GPG key
  ansible.builtin.get_url:
    url: https://downloads.typora.io/typora.gpg
    dest: /etc/apt/keyrings/typora.gpg
    mode: "0644"
  become: true
  when: app_states.typora | default('present') == 'present'

# Remove old .list format file (cleanup from apt_repository to deb822_repository migration)
- name: Remove old Typora .list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/typora.list
    state: absent
  become: true
  when: app_states.typora | default('present') == 'present'

# Use deb822 format to prevent duplicate repository entries
# For ARM support, change architectures to: amd64,arm64
- name: Add Typora APT repository (deb822)
  ansible.builtin.deb822_repository:
    name: typora
    types: [deb]
    uris: https://downloads.typora.io/linux
    suites: "./"
    components: []
    architectures: amd64
    signed_by: /etc/apt/keyrings/typora.gpg
    state: present
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Update APT cache after repository changes
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Install Typora
  ansible.builtin.apt:
    name: typora
    state: "{{ app_states.typora | default('present') }}"
    purge: "{{ app_states.typora | default('present') == 'absent' }}"
  become: true

- name: Install Pandoc (required for Typora export features)
  ansible.builtin.apt:
    name: pandoc
    state: "{{ app_states.typora | default('present') }}"
    purge: "{{ app_states.typora | default('present') == 'absent' }}"
  become: true

# Typora Community Plugin Manager installation
- name: Create Typora plugins directory
  ansible.builtin.file:
    path: "{{ typora_plugin_dir }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Create temporary directory for plugin manager download
  ansible.builtin.tempfile:
    state: directory
    suffix: typora_plugin
  register: typora_plugin_temp
  when: app_states.typora | default('present') == 'present'

- name: Download Typora Community Plugin Manager
  ansible.builtin.get_url:
    url: "{{ typora_plugin_manager_url }}"
    dest: "{{ typora_plugin_temp.path }}/typora-community-plugin.zip"
    mode: "0644"
  when: app_states.typora | default('present') == 'present'

- name: Extract plugin manager to plugins directory
  ansible.builtin.unarchive:
    src: "{{ typora_plugin_temp.path }}/typora-community-plugin.zip"
    dest: "{{ typora_plugin_dir }}"
    remote_src: true
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Clean up temporary directory
  ansible.builtin.file:
    path: "{{ typora_plugin_temp.path }}"
    state: absent
  when: app_states.typora | default('present') == 'present' and typora_plugin_temp.path is defined

- name: Check if window.html backup exists
  ansible.builtin.stat:
    path: "{{ typora_window_html_backup }}"
  register: typora_backup_stat
  when: app_states.typora | default('present') == 'present'

- name: Backup window.html
  ansible.builtin.copy:
    src: "{{ typora_window_html }}"
    dest: "{{ typora_window_html_backup }}"
    remote_src: true
    mode: preserve
  become: true
  when:
    - app_states.typora | default('present') == 'present'
    - not typora_backup_stat.stat.exists

- name: Check if window.html already has plugin loader
  ansible.builtin.command:
    cmd: grep -q "plugins/loader.js" "{{ typora_window_html }}"
  register: typora_loader_check
  failed_when: false
  changed_when: false
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Modify window.html to load plugin manager
  ansible.builtin.replace:
    path: "{{ typora_window_html }}"
    regexp: '</body></html>$'
    replace: '<script src="typora://app/userData/plugins/loader.js" type="module"></script></body></html>'
  become: true
  when:
    - app_states.typora | default('present') == 'present'
    - typora_loader_check.rc != 0

# Fish shell integration - mdopen function
- name: Create fish conf.d directory
  ansible.builtin.file:
    path: "{{ user.home }}/.config/fish/conf.d"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Deploy mdopen fish function
  ansible.builtin.template:
    src: mdopen.fish.j2
    dest: "{{ user.home }}/.config/fish/conf.d/mdopen.fish"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
  become: true
  when: app_states.typora | default('present') == 'present'

# COSMIC Theme Integration
# Load color variables (auto-generate if missing)
- name: Check if auto-colors.yml exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/group_vars/all/auto-colors.yml"
  register: auto_colors_file
  delegate_to: localhost
  become: false
  when: app_states.typora | default('present') == 'present'

- name: Generate color variables if missing
  ansible.builtin.command: "{{ playbook_dir }}/scripts/generate-cosmic-colors.sh"
  args:
    chdir: "{{ playbook_dir }}"
  delegate_to: localhost
  become: false
  when:
    - app_states.typora | default('present') == 'present'
    - not auto_colors_file.stat.exists

- name: Load auto-generated color variables
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/group_vars/all/auto-colors.yml"
  when: app_states.typora | default('present') == 'present'

- name: Create Typora themes directory
  ansible.builtin.file:
    path: "{{ user.home }}/.config/Typora/themes"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Deploy Cosmic Dark theme
  ansible.builtin.template:
    src: cosmic-dark.css.j2
    dest: "{{ user.home }}/.config/Typora/themes/cosmic-dark.css"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
  become: true
  when: app_states.typora | default('present') == 'present'

- name: Deploy Cosmic Light theme
  ansible.builtin.template:
    src: cosmic-light.css.j2
    dest: "{{ user.home }}/.config/Typora/themes/cosmic-light.css"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
  become: true
  when: app_states.typora | default('present') == 'present'

# Cleanup when absent
- name: Remove Typora APT repository when absent
  ansible.builtin.deb822_repository:
    name: typora
    state: absent
  become: true
  when: app_states.typora | default('present') == 'absent'

- name: Remove Typora GPG key when absent
  ansible.builtin.file:
    path: /etc/apt/keyrings/typora.gpg
    state: absent
  become: true
  when: app_states.typora | default('present') == 'absent'

- name: Remove mdopen fish function when absent
  ansible.builtin.file:
    path: "{{ user.home }}/.config/fish/conf.d/mdopen.fish"
    state: absent
  become: true
  when: app_states.typora | default('present') == 'absent'

- name: Restore window.html from backup when absent
  ansible.builtin.copy:
    src: "{{ typora_window_html_backup }}"
    dest: "{{ typora_window_html }}"
    remote_src: true
    mode: preserve
  become: true
  when:
    - app_states.typora | default('present') == 'absent'
    - typora_backup_stat is defined and typora_backup_stat.stat.exists

- name: Remove window.html backup when absent
  ansible.builtin.file:
    path: "{{ typora_window_html_backup }}"
    state: absent
  become: true
  when: app_states.typora | default('present') == 'absent'

- name: Remove Typora plugins directory when absent
  ansible.builtin.file:
    path: "{{ typora_plugin_dir }}"
    state: absent
  become: true
  when: app_states.typora | default('present') == 'absent'

- name: Remove Cosmic themes when absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ user.home }}/.config/Typora/themes/cosmic-dark.css"
    - "{{ user.home }}/.config/Typora/themes/cosmic-light.css"
  become: true
  when: app_states.typora | default('present') == 'absent'
