---
# Glow installation via APT repository
# Terminal-based markdown reader

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: app_states['glow'] | default('present') == 'present'

- name: Download Charm GPG key
  ansible.builtin.get_url:
    url: https://repo.charm.sh/apt/gpg.key
    dest: /tmp/charm.gpg
    mode: "0644"
  when: app_states['glow'] | default('present') == 'present'

- name: Import Charm GPG key to modern keyring location
  ansible.builtin.shell: |
    gpg --dearmor < /tmp/charm.gpg > /etc/apt/keyrings/charm.gpg
    chmod 644 /etc/apt/keyrings/charm.gpg
  args:
    creates: /etc/apt/keyrings/charm.gpg
  become: true
  when: app_states['glow'] | default('present') == 'present'

# Remove old .list format file (cleanup from apt_repository to deb822_repository migration)
- name: Remove old Charm .list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/charm.list
    state: absent
  become: true
  when: app_states['glow'] | default('present') == 'present'

# Use deb822 format to prevent duplicate repository entries
# For ARM support, change architectures to: amd64,arm64
- name: Add Charm APT repository (deb822)
  ansible.builtin.deb822_repository:
    name: charm
    types: [deb]
    uris: https://repo.charm.sh/apt/
    suites: "*"
    components: ["*"]
    architectures: amd64
    signed_by: /etc/apt/keyrings/charm.gpg
    state: present
  become: true
  when: app_states['glow'] | default('present') == 'present'

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: app_states['glow'] | default('present') == 'present'

- name: Install Glow
  ansible.builtin.apt:
    name: glow
    state: present
  become: true
  when: app_states['glow'] | default('present') == 'present'

- name: Clean up GPG key file
  ansible.builtin.file:
    path: /tmp/charm.gpg
    state: absent
  when: app_states['glow'] | default('present') == 'present'

# Deploy configuration
- name: Create glow config directory
  ansible.builtin.file:
    path: "{{ user.home }}/.config/glow"
    state: directory
    owner: "{{ user.name }}"
    mode: "0755"
  when: app_states['glow'] | default('present') == 'present'

- name: Deploy glow configuration
  ansible.builtin.template:
    src: glow.yml.j2
    dest: "{{ user.home }}/.config/glow/glow.yml"
    owner: "{{ user.name }}"
    mode: "0644"
  when: app_states['glow'] | default('present') == 'present'

- name: Create fish config.d directory
  ansible.builtin.file:
    path: "{{ user.home }}/.config/fish/conf.d"
    state: directory
    owner: "{{ user.name }}"
    mode: "0755"
  when: app_states['glow'] | default('present') == 'present'

- name: Deploy fish glow theme configuration
  ansible.builtin.template:
    src: glow.fish.j2
    dest: "{{ user.home }}/.config/fish/conf.d/glow.fish"
    owner: "{{ user.name }}"
    mode: "0644"
  when: app_states['glow'] | default('present') == 'present'

# Cleanup when absent
- name: Remove Glow when absent
  ansible.builtin.apt:
    name: glow
    state: absent
    purge: true
  become: true
  when: app_states['glow'] | default('present') == 'absent'

- name: Remove Charm repository when absent
  ansible.builtin.deb822_repository:
    name: charm
    state: absent
  become: true
  when: app_states['glow'] | default('present') == 'absent'

- name: Remove Charm GPG key when absent
  ansible.builtin.file:
    path: /etc/apt/keyrings/charm.gpg
    state: absent
  become: true
  when: app_states['glow'] | default('present') == 'absent'

- name: Remove glow configuration when absent
  ansible.builtin.file:
    path: "{{ user.home }}/.config/glow"
    state: absent
  when: app_states['glow'] | default('present') == 'absent'

- name: Remove fish glow configuration when absent
  ansible.builtin.file:
    path: "{{ user.home }}/.config/fish/conf.d/glow.fish"
    state: absent
  when: app_states['glow'] | default('present') == 'absent'
