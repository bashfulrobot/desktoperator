---
- name: Install Brave web app "team-agenda" launcher
  ansible.builtin.copy:
    src: "brave-team-agenda-launcher.sh"
    dest: "/usr/local/bin/brave-team-agenda"
    mode: "0755"
    owner: root
    group: root
  become: true
  when: app_states['team-agenda'] | default('present') == 'present'

- name: Install Brave web app "team-agenda" desktop entry
  ansible.builtin.copy:
    src: "brave-team-agenda.desktop"
    dest: "/usr/share/applications/brave-team-agenda.desktop"
    mode: "0644"
    owner: root
    group: root
  become: true
  when: app_states['team-agenda'] | default('present') == 'present'

- name: Install Brave web app icons
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    mode: "0644"
    owner: root
    group: root
  loop:
    - { src: "brave-team-agenda-icon-16.png", dest: "/usr/share/icons/hicolor/16x16/apps/brave-team-agenda.png" }
    - { src: "brave-team-agenda-icon-32.png", dest: "/usr/share/icons/hicolor/32x32/apps/brave-team-agenda.png" }
    - { src: "brave-team-agenda-icon-48.png", dest: "/usr/share/icons/hicolor/48x48/apps/brave-team-agenda.png" }
    - { src: "brave-team-agenda-icon-64.png", dest: "/usr/share/icons/hicolor/64x64/apps/brave-team-agenda.png" }
    - { src: "brave-team-agenda-icon-128.png", dest: "/usr/share/icons/hicolor/128x128/apps/brave-team-agenda.png" }
    - { src: "brave-team-agenda-icon-256.png", dest: "/usr/share/icons/hicolor/256x256/apps/brave-team-agenda.png" }
    - { src: "brave-team-agenda-icon-512.png", dest: "/usr/share/icons/hicolor/512x512/apps/brave-team-agenda.png" }
    - { src: "brave-team-agenda-icon-800.png", dest: "/usr/share/icons/hicolor/scalable/apps/brave-team-agenda.png" }
  become: true
  when: app_states['team-agenda'] | default('present') == 'present'
  notify: Update icon cache

- name: Remove Brave web app launcher when absent
  ansible.builtin.file:
    path: "/usr/local/bin/brave-team-agenda"
    state: absent
  become: true
  when: app_states['team-agenda'] | default('present') == 'absent'

- name: Remove Brave web app desktop entry when absent
  ansible.builtin.file:
    path: "/usr/share/applications/brave-team-agenda.desktop"
    state: absent
  become: true
  when: app_states['team-agenda'] | default('present') == 'absent'

- name: Remove Brave web app icons when absent
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
    owner: root
    group: root
  loop:
    - /usr/share/icons/hicolor/16x16/apps/brave-team-agenda.png
    - /usr/share/icons/hicolor/32x32/apps/brave-team-agenda.png
    - /usr/share/icons/hicolor/48x48/apps/brave-team-agenda.png
    - /usr/share/icons/hicolor/64x64/apps/brave-team-agenda.png
    - /usr/share/icons/hicolor/128x128/apps/brave-team-agenda.png
    - /usr/share/icons/hicolor/256x256/apps/brave-team-agenda.png
    - /usr/share/icons/hicolor/512x512/apps/brave-team-agenda.png
    - /usr/share/icons/hicolor/scalable/apps/brave-team-agenda.png
  become: true
  when: app_states['team-agenda'] | default('present') == 'absent'
