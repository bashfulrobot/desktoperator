# Apps role - application installations

- name: Include 1Password installation
  ansible.builtin.import_role:
    name: apps/1password
  tags: [1password]

- name: Include Web Browsers
  ansible.builtin.import_role:
    name: apps/browsers
  tags: [browsers]

- name: Include Brave web-app helpers
  ansible.builtin.import_role:
    name: apps/brave-builder
  tags: [brave-builder]

- name: Include Insync
  ansible.builtin.import_role:
    name: apps/insync
  tags: [insync]

- name: Include Codex Brave
  ansible.builtin.import_role:
    name: apps/brave-apps/codex-brave
  tags: [brave-apps, codex-brave]

- name: Include Spotify music clients
  ansible.builtin.import_role:
    name: apps/spotify
  tags: [spotify]

