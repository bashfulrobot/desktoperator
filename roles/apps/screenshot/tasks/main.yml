---
# Screenshot tools installation (Gradia via flatpak)

- name: Create Screenshots directory
  ansible.builtin.file:
    path: "{{ user.home }}/Screenshots"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
  become: true
  when: app_states.screenshot | default('present') == 'present'

