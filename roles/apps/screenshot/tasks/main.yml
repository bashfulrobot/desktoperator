- name: Install Gradia flatpak
  community.general.flatpak:
    name: be.alexandervanhee.gradia
    state: present
    method: user
  become: true
  become_user: "{{ user.name }}"
  when: app_states.screenshot | default('present') == 'present'

- name: Remove Gradia flatpak when absent
  community.general.flatpak:
    name: be.alexandervanhee.gradia
    state: absent
    method: user
  become: true
  become_user: "{{ user.name }}"
  when: app_states.screenshot | default('present') == 'absent'

