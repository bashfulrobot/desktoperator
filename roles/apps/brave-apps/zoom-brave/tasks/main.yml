---
# Zoom web client in Brave app mode
# For tips and troubleshooting, see: https://wiki.archlinux.org/title/Zoom_Meetings

- name: Install Zoom URL transformation handler
  ansible.builtin.copy:
    src: "zoom-url-handler.sh"
    dest: "/usr/local/bin/zoom-url-handler"
    mode: "0755"
    owner: root
    group: root
  become: true
  when: app_states['zoom-brave'] | default('present') == 'present'

- name: Install Brave web app "Zoom" launcher
  ansible.builtin.copy:
    src: "brave-Zoom-launcher.sh"
    dest: "/usr/local/bin/brave-Zoom"
    mode: "0755"
    owner: root
    group: root
  become: true
  when: app_states['zoom-brave'] | default('present') == 'present'

- name: Install Brave web app "Zoom" desktop entry
  ansible.builtin.copy:
    src: "brave-Zoom.desktop"
    dest: "/usr/share/applications/brave-Zoom.desktop"
    mode: "0644"
    owner: root
    group: root
  become: true
  when: app_states['zoom-brave'] | default('present') == 'present'

- name: Install Zoom URL handler desktop entry
  ansible.builtin.copy:
    src: "zoom-url.desktop"
    dest: "/usr/share/applications/zoom-url.desktop"
    mode: "0644"
    owner: root
    group: root
  become: true
  when: app_states['zoom-brave'] | default('present') == 'present'

- name: Install Brave web app icons
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    mode: "0644"
    owner: root
    group: root
  loop:
    - { src: "brave-Zoom-icon-16.png", dest: "/usr/share/icons/hicolor/16x16/apps/brave-Zoom.png" }
    - { src: "brave-Zoom-icon-32.png", dest: "/usr/share/icons/hicolor/32x32/apps/brave-Zoom.png" }
    - { src: "brave-Zoom-icon-48.png", dest: "/usr/share/icons/hicolor/48x48/apps/brave-Zoom.png" }
    - { src: "brave-Zoom-icon-64.png", dest: "/usr/share/icons/hicolor/64x64/apps/brave-Zoom.png" }
    - { src: "brave-Zoom-icon-128.png", dest: "/usr/share/icons/hicolor/128x128/apps/brave-Zoom.png" }
    - { src: "brave-Zoom-icon-256.png", dest: "/usr/share/icons/hicolor/256x256/apps/brave-Zoom.png" }
    - { src: "brave-Zoom-icon-512.png", dest: "/usr/share/icons/hicolor/512x512/apps/brave-Zoom.png" }
    - { src: "brave-Zoom-icon-800.png", dest: "/usr/share/icons/hicolor/scalable/apps/brave-Zoom.png" }
  become: true
  when: app_states['zoom-brave'] | default('present') == 'present'
  notify: Update icon cache

- name: Remove Zoom URL handler when absent
  ansible.builtin.file:
    path: "/usr/local/bin/zoom-url-handler"
    state: absent
  become: true
  when: app_states['zoom-brave'] | default('present') == 'absent'

- name: Remove Brave web app launcher when absent
  ansible.builtin.file:
    path: "/usr/local/bin/brave-Zoom"
    state: absent
  become: true
  when: app_states['zoom-brave'] | default('present') == 'absent'

- name: Remove Brave web app desktop entry when absent
  ansible.builtin.file:
    path: "/usr/share/applications/brave-Zoom.desktop"
    state: absent
  become: true
  when: app_states['zoom-brave'] | default('present') == 'absent'

- name: Remove Zoom URL handler desktop entry when absent
  ansible.builtin.file:
    path: "/usr/share/applications/zoom-url.desktop"
    state: absent
  become: true
  when: app_states['zoom-brave'] | default('present') == 'absent'

- name: Remove Brave web app icons when absent
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
    owner: root
    group: root
  loop:
    - /usr/share/icons/hicolor/16x16/apps/brave-Zoom.png
    - /usr/share/icons/hicolor/32x32/apps/brave-Zoom.png
    - /usr/share/icons/hicolor/48x48/apps/brave-Zoom.png
    - /usr/share/icons/hicolor/64x64/apps/brave-Zoom.png
    - /usr/share/icons/hicolor/128x128/apps/brave-Zoom.png
    - /usr/share/icons/hicolor/256x256/apps/brave-Zoom.png
    - /usr/share/icons/hicolor/512x512/apps/brave-Zoom.png
    - /usr/share/icons/hicolor/scalable/apps/brave-Zoom.png
  become: true
  when: app_states['zoom-brave'] | default('present') == 'absent'
