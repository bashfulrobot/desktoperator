---
- name: Install Brave web app "br-drive" launcher
  ansible.builtin.copy:
    src: "brave-br-drive-launcher.sh"
    dest: "/usr/local/bin/brave-br-drive"
    mode: "0755"
    owner: root
    group: root
  become: true
  when: app_states['br-drive'] | default('present') == 'present'

- name: Install Brave web app "br-drive" desktop entry
  ansible.builtin.copy:
    src: "brave-br-drive.desktop"
    dest: "/usr/share/applications/brave-br-drive.desktop"
    mode: "0644"
    owner: root
    group: root
  become: true
  when: app_states['br-drive'] | default('present') == 'present'

- name: Install Brave web app icons
  ansible.builtin.copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    mode: "0644"
    owner: root
    group: root
  loop:
    - { src: "brave-br-drive-icon-16.png", dest: "/usr/share/icons/hicolor/16x16/apps/brave-br-drive.png" }
    - { src: "brave-br-drive-icon-32.png", dest: "/usr/share/icons/hicolor/32x32/apps/brave-br-drive.png" }
    - { src: "brave-br-drive-icon-48.png", dest: "/usr/share/icons/hicolor/48x48/apps/brave-br-drive.png" }
    - { src: "brave-br-drive-icon-64.png", dest: "/usr/share/icons/hicolor/64x64/apps/brave-br-drive.png" }
    - { src: "brave-br-drive-icon-128.png", dest: "/usr/share/icons/hicolor/128x128/apps/brave-br-drive.png" }
    - { src: "brave-br-drive-icon-256.png", dest: "/usr/share/icons/hicolor/256x256/apps/brave-br-drive.png" }
    - { src: "brave-br-drive-icon-512.png", dest: "/usr/share/icons/hicolor/512x512/apps/brave-br-drive.png" }
    - { src: "brave-br-drive-icon-800.png", dest: "/usr/share/icons/hicolor/scalable/apps/brave-br-drive.png" }
  become: true
  when: app_states['br-drive'] | default('present') == 'present'
  notify: Update icon cache

- name: Remove Brave web app launcher when absent
  ansible.builtin.file:
    path: "/usr/local/bin/brave-br-drive"
    state: absent
  become: true
  when: app_states['br-drive'] | default('present') == 'absent'

- name: Remove Brave web app desktop entry when absent
  ansible.builtin.file:
    path: "/usr/share/applications/brave-br-drive.desktop"
    state: absent
  become: true
  when: app_states['br-drive'] | default('present') == 'absent'

- name: Remove Brave web app icons when absent
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
    owner: root
    group: root
  loop:
    - /usr/share/icons/hicolor/16x16/apps/brave-br-drive.png
    - /usr/share/icons/hicolor/32x32/apps/brave-br-drive.png
    - /usr/share/icons/hicolor/48x48/apps/brave-br-drive.png
    - /usr/share/icons/hicolor/64x64/apps/brave-br-drive.png
    - /usr/share/icons/hicolor/128x128/apps/brave-br-drive.png
    - /usr/share/icons/hicolor/256x256/apps/brave-br-drive.png
    - /usr/share/icons/hicolor/512x512/apps/brave-br-drive.png
    - /usr/share/icons/hicolor/scalable/apps/brave-br-drive.png
  become: true
  when: app_states['br-drive'] | default('present') == 'absent'

