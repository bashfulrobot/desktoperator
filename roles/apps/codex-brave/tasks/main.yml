---\n- name: Install Brave web app "codex" launcher\n  ansible.builtin.copy:\n    src: "brave-codex-launcher.sh"\n    dest: "/usr/local/bin/brave-codex"\n    mode: "0755"\n    owner: root\n    group: root\n  become: true\n  when: app_states['codex'] | default('present') == 'present'\n\n- name: Install Brave web app "codex" desktop entry\n  ansible.builtin.copy:\n    src: "brave-codex.desktop"\n    dest: "/usr/share/applications/brave-codex.desktop"\n    mode: "0644"\n    owner: root\n    group: root\n  become: true\n  when: app_states['codex'] | default('present') == 'present'\n\n- name: Install Brave web app icons\n  ansible.builtin.copy:\n    src: '{{ item.src }}'\n    dest: '{{ item.dest }}'\n    mode: "0644"\n    owner: root\n    group: root\n  loop:\n    - { src: "brave-codex-icon-16.png", dest: "/usr/share/icons/hicolor/16x16/apps/brave-codex.png" }\n    - { src: "brave-codex-icon-32.png", dest: "/usr/share/icons/hicolor/32x32/apps/brave-codex.png" }\n    - { src: "brave-codex-icon-48.png", dest: "/usr/share/icons/hicolor/48x48/apps/brave-codex.png" }\n    - { src: "brave-codex-icon-64.png", dest: "/usr/share/icons/hicolor/64x64/apps/brave-codex.png" }\n    - { src: "brave-codex-icon-128.png", dest: "/usr/share/icons/hicolor/128x128/apps/brave-codex.png" }\n    - { src: "brave-codex-icon-256.png", dest: "/usr/share/icons/hicolor/256x256/apps/brave-codex.png" }\n    - { src: "brave-codex-icon-512.png", dest: "/usr/share/icons/hicolor/512x512/apps/brave-codex.png" }\n    - { src: "brave-codex-icon-800.png", dest: "/usr/share/icons/hicolor/scalable/apps/brave-codex.png" }\n  become: true\n  when: app_states['codex'] | default('present') == 'present'\n  notify: Update icon cache\n\n- name: Remove Brave web app launcher when absent\n  ansible.builtin.file:\n    path: "/usr/local/bin/brave-codex"\n    state: absent\n  become: true\n  when: app_states['codex'] | default('present') == 'absent'\n\n- name: Remove Brave web app desktop entry when absent\n  ansible.builtin.file:\n    path: "/usr/share/applications/brave-codex.desktop"\n    state: absent\n  become: true\n  when: app_states['codex'] | default('present') == 'absent'\n\n- name: Remove Brave web app icons when absent\n  ansible.builtin.file:\n    path: '{{ item }}'\n    state: absent\n    owner: root\n    group: root\n  loop:\n    - /usr/share/icons/hicolor/16x16/apps/brave-codex.png\n    - /usr/share/icons/hicolor/32x32/apps/brave-codex.png\n    - /usr/share/icons/hicolor/48x48/apps/brave-codex.png\n    - /usr/share/icons/hicolor/64x64/apps/brave-codex.png\n    - /usr/share/icons/hicolor/128x128/apps/brave-codex.png\n    - /usr/share/icons/hicolor/256x256/apps/brave-codex.png\n    - /usr/share/icons/hicolor/512x512/apps/brave-codex.png\n    - /usr/share/icons/hicolor/scalable/apps/brave-codex.png\n  become: true\n  when: app_states['codex'] | default('present') == 'absent'\n
