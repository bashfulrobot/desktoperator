---
# Insomnia API client installation
# The open-source, cross-platform API client for GraphQL, REST, WebSockets and gRPC
# Note: Using focal repository as newer Ubuntu releases aren't supported yet

- name: Set Insomnia repository codename
  ansible.builtin.set_fact:
    insomnia_codename: "focal"

- name: Install apt prerequisites for Insomnia
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
    state: present
  become: true

- name: Add Insomnia GPG key
  ansible.builtin.apt_key:
    url: https://packages.konghq.com/public/insomnia/gpg.474B9148D779222B.key
    keyring: /usr/share/keyrings/kong-insomnia-archive-keyring.gpg
    state: present
  become: true

# Remove old .list format file (cleanup from apt_repository to deb822_repository migration)
- name: Remove old Insomnia .list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kong-insomnia.list
    state: absent
  become: true
  when: app_states['insomnia'] | default('present') == 'present'

# Use deb822 format to prevent duplicate repository entries
# For ARM support, change architectures to: amd64,arm64
- name: Add Insomnia repository (deb822)
  ansible.builtin.deb822_repository:
    name: kong-insomnia
    types: [deb]
    uris: https://packages.konghq.com/public/insomnia/deb/ubuntu
    suites: "{{ insomnia_codename }}"
    components: [main]
    architectures: amd64
    signed_by: /usr/share/keyrings/kong-insomnia-archive-keyring.gpg
    state: "{{ app_states['insomnia'] | default('present') }}"
  become: true
  notify: Update apt cache

- name: Flush handlers to ensure apt cache is updated
  ansible.builtin.meta: flush_handlers
- name: Install Insomnia
  ansible.builtin.apt:
    name: insomnia
    state: "{{ app_states['insomnia'] | default('present') }}"
    update_cache: true
  become: true

- name: Remove Insomnia repository when absent
  ansible.builtin.deb822_repository:
    name: kong-insomnia
    state: absent
  become: true
  when: app_states['insomnia'] | default('present') == 'absent'

- name: Remove Insomnia GPG key when absent
  ansible.builtin.file:
    path: /usr/share/keyrings/kong-insomnia-archive-keyring.gpg
    state: absent
  become: true
  when: app_states['insomnia'] | default('present') == 'absent'
