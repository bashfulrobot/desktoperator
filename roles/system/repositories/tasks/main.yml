---
# Ubuntu restricted extras installation
# Installs commonly used media codecs and fonts

- name: Pre-accept EULA for ttf-mscorefonts-installer
  ansible.builtin.debconf:
    name: ttf-mscorefonts-installer
    question: msttcorefonts/accepted-mscorefonts-eula
    value: "true"
    vtype: select
  become: true
  when: ubuntu_restricted_extras_state == 'present'

- name: Install ubuntu-restricted-extras
  ansible.builtin.apt:
    name: ubuntu-restricted-extras
    state: "{{ ubuntu_restricted_extras_state }}"
    install_recommends: true
  become: true
  when: ubuntu_restricted_extras_state == 'present'

- name: Remove ubuntu-restricted-extras
  ansible.builtin.apt:
    name: ubuntu-restricted-extras
    state: absent
    purge: true
    autoremove: true
  become: true
  when: ubuntu_restricted_extras_state == 'absent'
