---
# IAC tools installation tasks
# Includes Terraform and Google Cloud CLI

# Terraform installation
- name: Add HashiCorp repository with GPG key
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_distribution_release }}"
    components: [main]
    architectures: "{{ terraform_arch_mapping[ansible_architecture] | default(ansible_architecture) }}"
    signed_by: "{{ terraform_gpg_key_url }}"
    state: "{{ iac_state }}"
  become: true
  when: iac_state == 'present'
  tags: [iac, system]

- name: Update apt cache after HashiCorp repository changes
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: iac_state == 'present'
  tags: [iac, system]

- name: Install Terraform package
  ansible.builtin.apt:
    name: "{{ terraform_packages }}"
    state: "{{ iac_state }}"
    purge: "{{ iac_state == 'absent' }}"
  become: true
  tags: [iac, system]

# Google Cloud CLI installation
- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: iac_state == 'present'
  tags: [iac, system]

- name: Download Google Cloud GPG key
  ansible.builtin.get_url:
    url: "{{ gcloud_gpg_key_url }}"
    dest: /tmp/google-cloud.gpg
    mode: "0644"
  when: iac_state == 'present'
  tags: [iac, system]

- name: Import Google Cloud GPG key to keyring location
  ansible.builtin.shell: |
    gpg --dearmor < /tmp/google-cloud.gpg > /etc/apt/keyrings/cloud.google.gpg
    chmod 644 /etc/apt/keyrings/cloud.google.gpg
  args:
    creates: /etc/apt/keyrings/cloud.google.gpg
  become: true
  when: iac_state == 'present'
  tags: [iac, system]

# Remove old .list format file (cleanup from apt_repository to deb822_repository migration)
- name: Remove old Google Cloud .list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/google-cloud-sdk.list
    state: absent
  become: true
  when: iac_state == 'present'
  tags: [iac, system]

# Use deb822 format to prevent duplicate repository entries
# For ARM support, change architectures to: amd64,arm64
- name: Add Google Cloud APT repository (deb822)
  ansible.builtin.deb822_repository:
    name: google-cloud-sdk
    types: [deb]
    uris: "{{ gcloud_repo_url }}"
    suites: cloud-sdk
    components: [main]
    architectures: amd64
    signed_by: /etc/apt/keyrings/cloud.google.gpg
    state: "{{ iac_state }}"
  become: true
  tags: [iac, system]

- name: Update apt cache after Google Cloud repository changes
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: iac_state == 'present'
  tags: [iac, system]

- name: Install Google Cloud CLI
  ansible.builtin.apt:
    name: "{{ gcloud_packages }}"
    state: "{{ iac_state }}"
    purge: "{{ iac_state == 'absent' }}"
  become: true
  tags: [iac, system]

- name: Clean up Google Cloud GPG key file
  ansible.builtin.file:
    path: /tmp/google-cloud.gpg
    state: absent
  when: iac_state == 'present'
  tags: [iac, system]

# Cleanup when absent
- name: Remove HashiCorp repository when absent
  ansible.builtin.deb822_repository:
    name: hashicorp
    state: absent
  become: true
  when: iac_state == 'absent'
  tags: [iac, system]

- name: Remove Google Cloud repository when absent
  ansible.builtin.deb822_repository:
    name: google-cloud-sdk
    state: absent
  become: true
  when: iac_state == 'absent'
  tags: [iac, system]

- name: Remove Google Cloud GPG key when absent
  ansible.builtin.file:
    path: /etc/apt/keyrings/cloud.google.gpg
    state: absent
  become: true
  when: iac_state == 'absent'
  tags: [iac, system]
