---
# Tailscale VPN installation and configuration

- name: Add Tailscale GPG key
  ansible.builtin.apt_key:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
  become: true
  tags: [tailscale, vpn]

# Remove old .list format file (cleanup from apt_repository to deb822_repository migration)
- name: Remove old Tailscale .list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/tailscale.list
    state: absent
  become: true
  tags: [tailscale, vpn]

# Use deb822 format to prevent duplicate repository entries
# For ARM support, change architectures to: amd64,arm64
- name: Add Tailscale repository (deb822)
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: https://pkgs.tailscale.com/stable/ubuntu
    suites: noble
    components: [main]
    architectures: amd64
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
  become: true
  tags: [tailscale, vpn]

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [tailscale, vpn]

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
  become: true
  tags: [tailscale, vpn]

- name: Start and enable Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
  become: true
  tags: [tailscale, vpn]
