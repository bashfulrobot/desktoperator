---
# Install build-kong-docs-rag script to ~/.local/bin
# This script clones Jekyll docs, processes with docling, and creates RAG vector database

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ user.home }}/.local/bin"
    state: directory
    owner: "{{ user.name }}"
    mode: "0755"
  when: build_kong_docs_rag_state == 'present'

- name: Check if script exists at source path
  ansible.builtin.stat:
    path: "{{ build_kong_docs_rag_source }}"
  register: script_source_stat
  delegate_to: localhost
  become: false
  when: build_kong_docs_rag_state == 'present'

- name: Fail if source script does not exist
  ansible.builtin.fail:
    msg: "Source script not found at {{ build_kong_docs_rag_source }}"
  when:
    - build_kong_docs_rag_state == 'present'
    - not script_source_stat.stat.exists

- name: Copy build-kong-docs-rag script to ~/.local/bin
  ansible.builtin.copy:
    src: "{{ build_kong_docs_rag_source }}"
    dest: "{{ build_kong_docs_rag_dest }}"
    owner: "{{ user.name }}"
    mode: "0755"
  when: build_kong_docs_rag_state == 'present'

- name: Show installation status
  ansible.builtin.debug:
    msg: "build-kong-docs-rag script installed to {{ build_kong_docs_rag_dest }}"
  when: build_kong_docs_rag_state == 'present'

- name: Ensure RAG work directory exists
  ansible.builtin.file:
    path: "{{ build_kong_docs_rag_work_dir }}"
    state: directory
    owner: "{{ user.name }}"
    mode: "0755"
  when: build_kong_docs_rag_state == 'present'

- name: Create virtual environment for Kong docs RAG
  ansible.builtin.command:
    cmd: python3 -m venv {{ user.home }}/.local/share/kong-docs-rag-venv
    creates: "{{ user.home }}/.local/share/kong-docs-rag-venv/bin/python"
  become: true
  become_user: "{{ user.name }}"
  when: build_kong_docs_rag_state == 'present'

- name: Install Python RAG dependencies in virtual environment
  ansible.builtin.pip:
    name:
      - docling
      - qdrant-client
      - fastembed
    state: present
    virtualenv: "{{ user.home }}/.local/share/kong-docs-rag-venv"
  become: true
  become_user: "{{ user.name }}"
  when: build_kong_docs_rag_state == 'present'

- name: Copy Docling-based Python script to ~/.local/bin
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/scripts/build-kong-docs-rag-docling"
    dest: "{{ user.home }}/.local/bin/build-kong-docs-rag-docling.py"
    owner: "{{ user.name }}"
    mode: "0644"
  when: build_kong_docs_rag_state == 'present'

- name: Deploy wrapper script for build-kong-docs-rag-docling
  ansible.builtin.template:
    src: build-kong-docs-rag-docling-wrapper.j2
    dest: "{{ user.home }}/.local/bin/build-kong-docs-rag-docling"
    owner: "{{ user.name }}"
    mode: "0755"
  when: build_kong_docs_rag_state == 'present'

- name: Deploy justfile for RAG management
  ansible.builtin.template:
    src: justfile.j2
    dest: "{{ build_kong_docs_rag_justfile_dest }}"
    owner: "{{ user.name }}"
    mode: "0644"
  when: build_kong_docs_rag_state == 'present'

- name: Show justfile deployment status
  ansible.builtin.debug:
    msg: "Justfile deployed to {{ build_kong_docs_rag_justfile_dest }}"
  when: build_kong_docs_rag_state == 'present'

# Cleanup when absent
- name: Remove build-kong-docs-rag script when absent
  ansible.builtin.file:
    path: "{{ build_kong_docs_rag_dest }}"
    state: absent
  when: build_kong_docs_rag_state == 'absent'

- name: Remove Docling wrapper script when absent
  ansible.builtin.file:
    path: "{{ user.home }}/.local/bin/build-kong-docs-rag-docling"
    state: absent
  when: build_kong_docs_rag_state == 'absent'

- name: Remove Docling Python script when absent
  ansible.builtin.file:
    path: "{{ user.home }}/.local/bin/build-kong-docs-rag-docling.py"
    state: absent
  when: build_kong_docs_rag_state == 'absent'

- name: Remove Kong docs RAG virtual environment when absent
  ansible.builtin.file:
    path: "{{ user.home }}/.local/share/kong-docs-rag-venv"
    state: absent
  when: build_kong_docs_rag_state == 'absent'

- name: Remove RAG work directory when absent
  ansible.builtin.file:
    path: "{{ build_kong_docs_rag_work_dir }}"
    state: absent
  when: build_kong_docs_rag_state == 'absent'
