---
# Terminal role - terminal and shell enhancement tools

- name: Include Zellij terminal multiplexer
  ansible.builtin.import_role:
    name: terminal/zellij
  tags: [terminal, zellij]

- name: Include Starship prompt
  ansible.builtin.import_role:
    name: terminal/starship
  tags: [terminal, starship]

- name: Include Terminal Experience
  ansible.builtin.import_role:
    name: terminal/terminal-experience
  tags: [terminal, terminal-experience]

- name: Include eza modern ls replacement
  ansible.builtin.import_role:
    name: terminal/eza
  tags: [terminal, eza]

- name: Include zns DNS lookup tool
  ansible.builtin.import_role:
    name: terminal/zns
  tags: [terminal, zns]

- name: Include lswt Wayland window switcher
  ansible.builtin.import_role:
    name: terminal/lswt
  tags: [terminal, lswt]

- name: Include Amber search and replace tool
  ansible.builtin.import_role:
    name: terminal/amber
  tags: [terminal, amber]
