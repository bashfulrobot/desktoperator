---
# Infra role defaults
# Infrastructure tools state management (present/absent)
# Tags control WHAT runs, state variables control HOW it runs
# All infra tools default to 'present' via | default('present') in role tasks
# Override in host_vars for host-specific control

# Infrastructure tool application states
# Only explicitly managed tools are listed here
# Tools not listed default to 'present' in role tasks
app_states:
  # Explicitly present tools
  restic: present
  # ansible, docker, k8s default to present
