---
# Main playbook - runs all configuration
- name: Configure Desktop Systems
  hosts: all
  become: true

  roles:
  # Bootstrap role - only run with --tags bootstrap (never runs by default)
    - role: bootstrap
      tags: [bootstrap, never]

    # Core system configuration
    - role: system
      tags: [system, core]

    # Development tools and languages
    - role: dev
      tags: [dev]

    # Infrastructure and orchestration tools
    - role: infra
      tags: [infra]

    # Terminal and shell enhancements
    - role: terminal
      tags: [terminal]

    # Desktop environment configuration
    - role: desktop
      tags: [cosmic, core]

    # User applications
    - role: apps
      tags: [apps]

    # Office communications and productivity
    - role: offcoms
      tags: [offcoms]

    # Kong-related tools and collaboration
    - role: kong
      tags: [kong]

    # Custom desktop launchers
    - role: custom_launchers
      when: inventory_hostname == 'qbert'
      tags: [custom_launchers, apps]
